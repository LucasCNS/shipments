services:
  # PostgreSQL Database (shared for both APIs)
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: shipments,costs
      POSTGRES_INITDB_ARGS: "-c timezone=UTC"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-shipments.sql
      - ./scripts/init-costs-db.sql:/docker-entrypoint-initdb.d/02-init-costs.sql
    networks:
      - apis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Shipments API Service
  shipments-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: shipments
    container_name: shipments-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=shipments;Username=postgres;Password=postgres;"
      ExternalServices__CostsApi__BaseUrl: "http://costs-api:8080/"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - apis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Costs API Service
  costs-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: costs
    container_name: costs-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=costs;Username=postgres;Password=postgres;"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - apis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  apis-network:
    driver: bridge
